<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: filter rail on the left, results column in the middle, question
   panel slides over from the right. Graph-paper neutrals, one ink-blue accent. */
:root {
  --paper: #f5f6f3;
  --sheet: #ffffff;
  --ink: #1d2430;
  --muted: #5d6675;
  --rule: #dfe2dc;
  --accent: #2c4f9e;
  --accent-soft: #e6ecf8;
  --exclude: #a23b3b;
  --exclude-soft: #f6e5e3;
  --flag: #b7791f;
  --ok: #2f7a4f;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14181e; --sheet: #1c2129; --ink: #e4e7ec; --muted: #9aa3b2;
    --rule: #2d3440; --accent: #8aa8ec; --accent-soft: #24304a;
    --exclude: #e48a83; --exclude-soft: #3a2424; --flag: #e0a84a; --ok: #6cc391;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14181e; --sheet: #1c2129; --ink: #e4e7ec; --muted: #9aa3b2;
  --rule: #2d3440; --accent: #8aa8ec; --accent-soft: #24304a;
  --exclude: #e48a83; --exclude-soft: #3a2424; --flag: #e0a84a; --ok: #6cc391;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
@media (max-width: 820px) { .app { grid-template-columns: 1fr; height: auto; } .rail { max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); } }

/* rail */
.rail { overflow-y: auto; border-right: 1px solid var(--rule); padding: 16px; display: flex; flex-direction: column; gap: 18px; background: var(--sheet); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { font: 600 20px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.brand .total { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.group h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.group h2 button { font-size: 11px; letter-spacing: 0; text-transform: none; border: 0; background: none; color: var(--accent); padding: 0; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 2px 9px; font-size: 12px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
.chip.inc { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.exc { background: var(--exclude-soft); border-color: var(--exclude); color: var(--exclude); text-decoration: line-through; }
.chip.zero { opacity: .45; }
.tagfilter { width: 100%; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); margin-bottom: 8px; font-size: 12px; }
.taglist { max-height: 260px; overflow-y: auto; }
.row2 { display: flex; gap: 8px; align-items: center; }
.row2 input { width: 80px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.folders { list-style: none; margin: 0; padding: 0; }
.folders li button.f { width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.folders li button.f:hover { background: var(--paper); }
.folders li button.f[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.folders .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.folders .sub { padding-left: 14px; }
.foot { margin-top: auto; font-size: 11px; color: var(--muted); }

/* main */
main { overflow-y: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bar .count { font: 600 16px var(--font-display); font-variant-numeric: tabular-nums; }
.bar .count small { font: 400 12px var(--font-body); color: var(--muted); margin-left: 6px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 11px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.danger { color: var(--exclude); }
.btn:disabled { opacity: .5; cursor: default; }
select.btn { padding: 5px 8px; }
.selbar { position: sticky; top: -16px; z-index: 3; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.selbar[hidden] { display: none; }
.selbar .what { font-weight: 600; color: var(--accent); margin-right: auto; }
.activefilters { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card input[type=checkbox] { margin-top: 3px; }
.card .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.card .id { font-family: var(--font-mono); font-size: 12px; color: var(--ink); border: 0; background: none; padding: 0; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.card .id:hover { text-decoration-color: var(--accent); color: var(--accent); }
.card .body { grid-column: 2; overflow-x: auto; cursor: pointer; }
.card .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; }
.diff { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 11px; border-radius: 4px; padding: 1px 6px; color: #fff; }
.d1,.d2 { background: #4f8a6b; } .d3,.d4 { background: #3f6fb0; } .d5 { background: #7a58a8; } .d6,.d7,.d8 { background: #b04848; }
.d0 { background: var(--muted); }
.badge { font-size: 11px; border-radius: 4px; padding: 0 6px; border: 1px solid currentColor; }
.badge.flag { color: var(--flag); } .badge.folder { color: var(--accent); } .badge.new { color: var(--ok); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
.tex p { margin: 0 0 .6em; } .tex p:last-child { margin-bottom: 0; }
.tex ol, .tex ul { margin: .3em 0 .6em; padding-left: 1.6em; }
.tex li[data-label] { list-style: none; } .tex li[data-label]::before { content: attr(data-label) " "; margin-left: -1.6em; display: inline-block; width: 1.6em; }
.tex figure { margin: .6em 0; text-align: center; }
.tex figure img { max-width: 100%; background: #fff; border-radius: 4px; padding: 4px; }
.tex .center { text-align: center; }
.tex .boxed { border: 1px solid currentColor; padding: 0 4px; }
.tex blockquote { margin: .4em 0 .6em 1em; padding-left: .8em; border-left: 3px solid var(--rule); }
.tex table { border-collapse: collapse; margin: .4em auto; } .tex td { border: 1px solid var(--rule); padding: 2px 8px; }
.tex .asy-missing { font-size: 12px; color: var(--muted); border: 1px dashed var(--rule); padding: 6px; border-radius: 6px; }
.tex mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; }
.loading { color: var(--muted); font-style: italic; }

/* panel + dialogs */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.35); z-index: 10; display: none; }
.scrim.open { display: block; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--sheet); z-index: 11; border-left: 1px solid var(--rule); display: none; flex-direction: column; }
.panel.open { display: flex; }
.panel header { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel header .pid { font-family: var(--font-mono); font-size: 13px; margin-right: auto; }
.panel .content { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
.panel h3 { font: 600 15px var(--font-display); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
.panel .meta { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
.panel .note { font-size: 13px; background: var(--paper); border-left: 3px solid var(--flag); padding: 8px 10px; border-radius: 4px; }
.panel .src { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; background: var(--paper); padding: 10px; border-radius: 6px; max-height: 300px; overflow: auto; }
dialog { border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink); padding: 18px; width: min(460px, 92vw); }
dialog::backdrop { background: rgba(10,14,20,.4); }
dialog h3 { margin: 0 0 10px; font: 600 16px var(--font-display); }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
dialog input[type=text], dialog textarea, dialog select { width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
dialog textarea { min-height: 80px; resize: vertical; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; z-index: 20; font-size: 13px; max-width: 90vw; }
.progress { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .panel.open { animation: slide .16s ease-out; } @keyframes slide { from { transform: translateX(30px); opacity: .6; } } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Filters">
    <div class="brand"><h1>Question Bank</h1><span class="total" id="total">loading…</span></div>

    <div class="group">
      <input class="search" id="q" type="search" placeholder="Search text, ID, or source" autocomplete="off" aria-label="Search">
      <div class="hint" id="searchhint">Matches all words. Paste an ID to jump to it.</div>
    </div>

    <div class="group">
      <h2>Folders <button id="newfolder" type="button">New folder</button></h2>
      <ul class="folders" id="folders"></ul>
    </div>

    <div class="group">
      <h2>Tags <button id="cleartags" type="button">Clear</button></h2>
      <div class="seg" role="group" aria-label="Tag matching">
        <button type="button" id="mode-all" aria-pressed="true">Has all</button>
        <button type="button" id="mode-any" aria-pressed="false">Has any</button>
      </div>
      <input class="tagfilter" id="tagfilter" type="search" placeholder="Find a tag" aria-label="Find a tag">
      <div class="hint" style="margin:-4px 0 6px">Click once to include, twice to exclude.</div>
      <div class="chips taglist" id="tags"></div>
    </div>

    <div class="group">
      <h2>Difficulty <button id="cleardiff" type="button">Clear</button></h2>
      <div class="chips" id="diffs"></div>
    </div>

    <div class="group">
      <h2>Source <button id="clearsrc" type="button">Clear</button></h2>
      <div class="chips" id="comps" style="margin-bottom:8px"></div>
      <div class="row2"><label for="ymin" class="hint" style="margin:0">Year</label><input id="ymin" type="number" placeholder="from" aria-label="Year from"><input id="ymax" type="number" placeholder="to" aria-label="Year to"></div>
    </div>

    <div class="group">
      <h2>More</h2>
      <div class="chips" id="more"></div>
    </div>

    <div class="foot" id="foot"></div>
  </aside>

  <main id="main">
    <div class="bar">
      <div class="count" id="count">Loading…</div>
      <div class="row2" style="flex-wrap:wrap">
        <label class="hint" for="sort" style="margin:0">Sort</label>
        <select class="btn" id="sort">
          <option value="id">ID</option>
          <option value="diff">Difficulty, easiest first</option>
          <option value="diffd">Difficulty, hardest first</option>
          <option value="src">Source and year</option>
        </select>
        <button class="btn" id="selall" type="button">Select all results</button>
        <button class="btn" id="importbtn" type="button">Import ZIP</button>
        <input type="file" id="importfile" accept=".zip" hidden>
      </div>
    </div>
    <div class="activefilters" id="active"></div>
    <div class="selbar" id="selbar" hidden>
      <span class="what" id="selwhat"></span>
      <button class="btn" type="button" data-act="move">Move to folder</button>
      <button class="btn" type="button" data-act="zip">Export ZIP</button>
      <button class="btn" type="button" data-act="tex">Export .tex</button>
      <button class="btn" type="button" data-act="flag">Flag for Claude</button>
      <button class="btn danger" type="button" data-act="trash">Delete</button>
      <button class="btn" type="button" data-act="restore" hidden>Restore</button>
      <button class="btn danger" type="button" data-act="purge" hidden>Delete forever</button>
      <button class="btn" type="button" data-act="clear">Clear selection</button>
    </div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<section class="panel" id="panel" aria-label="Question" aria-modal="true" role="dialog">
  <header>
    <span class="pid" id="pid"></span>
    <button class="btn" type="button" id="p-copy">Copy LaTeX</button>
    <button class="btn" type="button" id="p-flag">Flag</button>
    <button class="btn" type="button" id="p-move">Move</button>
    <button class="btn danger" type="button" id="p-trash">Delete</button>
    <button class="btn" type="button" id="p-close" aria-label="Close">Close</button>
  </header>
  <div class="content" id="pcontent"></div>
</section>

<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>

<script>
window.MathJax = {
  loader: { load: ["[tex]/textmacros"] },
  tex: { packages: { "[+]": ["textmacros"] }, inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true, processEnvironments: true,
         macros: { degree: "^\\circ", textdegree: "^\\circ" } },
  svg: { fontCache: "global" },
  options: { enableMenu: false },
  startup: { typeset: false }
};

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<script>
"use strict";
/* ================================================================
   Question Bank page.
   Data: static files in data/ (built by tools/build_site.py from the
   GitHub repo) + a small "overlay" of things changed on the page
   (folders, placements, trash, flags, imported questions), kept in the
   Claude artifact database or, in standalone mode, in localStorage.
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const HEX = "0123456789abcdef";
const PAGE = 20;

/* ---------- data loading ---------- */
async function fetchJsonGz(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ": HTTP " + r.status);
  const outer = await r.json();
  if (!outer || typeof outer.gz !== "string") return outer;   // plain JSON also accepted
  const bin = atob(outer.gz); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(ds).text());
}
async function sha1hex(s) {
  const d = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(s));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

const D = {
  built: "", tags: [], tagIndex: new Map(), comps: [], compIndex: new Map(),
  qs: [],              // [{id, tags:int[], diff, comp, year, div, qn, ndiag, h, imported}]
  byId: new Map(),
  text: {},            // h -> {id: {m,q,s}}
  textLoading: {},
  svg: {},             // chunk -> {id: {path: svg}}
  svgLoading: {},
};
function tagId(name) { if (!D.tagIndex.has(name)) { D.tagIndex.set(name, D.tags.length); D.tags.push(name); } return D.tagIndex.get(name); }
function compId(name) { if (name == null || name === "") return -1; if (!D.compIndex.has(name)) { D.compIndex.set(name, D.comps.length); D.comps.push(name); } return D.compIndex.get(name); }

async function loadIndex() {
  const ix = await fetchJsonGz("data/index.json");
  D.built = ix.built;
  ix.tags.forEach(tagId); ix.comps.forEach(compId);
  for (const r of ix.rows) {
    const q = { id: r[0], tags: r[1], diff: r[2], comp: r[3], year: r[4], div: r[5], qn: r[6], ndiag: r[7], h: r[8], imported: false };
    D.qs.push(q); D.byId.set(q.id, q);
  }
}
function loadText(h) {
  if (D.text[h]) return Promise.resolve(D.text[h]);
  if (!D.textLoading[h]) D.textLoading[h] = fetchJsonGz(`data/text/t${h}.json`).then(t => { D.text[h] = t; return t; });
  return D.textLoading[h];
}
function loadSvg(hh) {
  if (D.svg[hh]) return Promise.resolve(D.svg[hh]);
  if (!D.svgLoading[hh]) D.svgLoading[hh] = fetchJsonGz(`data/svg/s${hh}.json`).then(t => { D.svg[hh] = t; return t; }).catch(() => ({}));
  return D.svgLoading[hh];
}
function textOf(q) {
  if (q.imported) { const d = S.imported[q.id]; return d ? { m: d.m, q: d.q, s: d.s } : null; }
  return D.text[q.h] ? D.text[q.h][q.id] : null;
}
async function ensureText(q) { if (!q.imported) await loadText(q.h); return textOf(q); }
async function assetsOf(q) {
  if (q.imported) return (S.imported[q.id] || {}).assets || {};
  const k = (parseInt((await sha1hex(q.id)).slice(0, 2), 16) >> 2).toString(16).padStart(2, "0");
  return (await loadSvg(k))[q.id] || {};
}
let textAll = false;
async function loadAllTextInBackground() {
  for (const h of HEX) { await loadText(h); updateSearchHint(); if (state.query) refresh(); }
  textAll = true; updateSearchHint(); if (state.query) refresh();
}

/* ---------- overlay store ---------- */
// S holds the current overlay. Shard maps are keyed by sha1(id)[0].
const S = { folders: {}, place: {}, trash: {}, flags: {}, imported: {}, info: {} };
let store = null;
const placeOf = q => (S.place[q.h] || {})[q.id] || null;
const trashOf = q => { const t = (S.trash[q.h] || {})[q.id]; return t || null; };
const flagOf = q => S.flags[q.id] || null;

class ClaudeStore {
  constructor(db) { this.db = db; this.exists = new Set(); this.kind = "claude"; this.writable = true; }
  start(onChange) {
    const sub = (coll, apply) => this.db.collection(coll).onSnapshot(snap => {
      apply(snap); onChange(coll, snap.metadata);
    }, e => toast(`Couldn't read ${coll}: ${e.message || e.code}`));
    sub("folders", s => { S.folders = {}; s.docs.forEach(d => { if (d.exists) S.folders[d.id] = d.data(); }); });
    sub("place", s => { S.place = {}; s.docs.forEach(d => { this.exists.add("place/" + d.id); S.place[d.id] = clean((d.data() || {}).m); }); });
    sub("trash", s => { S.trash = {}; s.docs.forEach(d => { this.exists.add("trash/" + d.id); S.trash[d.id] = clean((d.data() || {}).m); }); });
    sub("flags", s => { S.flags = {}; s.docs.forEach(d => { S.flags[d.id] = d.data(); }); });
    sub("imported", s => { S.imported = {}; s.docs.forEach(d => { S.imported[d.id] = d.data(); }); syncImported(); });
    sub("meta", s => { S.info = {}; s.docs.forEach(d => { S.info[d.id] = d.data(); }); });
  }
  async writeShards(coll, changes) { // changes: {qid: value|null}
    const by = {};
    for (const [id, v] of Object.entries(changes)) { const q = D.byId.get(id); if (!q) continue; (by[q.h] = by[q.h] || {})[id] = v; }
    for (const [h, m] of Object.entries(by)) {
      const ref = this.db.doc(`${coll}/${h}`);
      // optimistic local update
      const cur = { ...(S[coll === "place" ? "place" : "trash"][h] || {}) };

    .replace(/\\\\(\[[^\]]*\])?/g, "<br>").replace(/~/g, "&nbsp;").replace(/---/g, "—").replace(/--/g, "–")

    .replace(/\\checkmark(?![a-zA-Z])/g, "✓").replace(/\\texttimes(?![a-zA-Z])/g, "×").replace(/\\textasciicircum(?![a-zA-Z])/g, "^")
    .replace(/\\LaTeX(?![a-zA-Z])\\?/g, "LaTeX").replace(/\\TeX(?![a-zA-Z])\\?/g, "TeX")
    .replace(/\\H\{o\}/g, "ő").replace(/\\H\{u\}/g, "ű").replace(/\\"\{?([aouAOU])\}?/g, (_, c) => ({a:"ä",o:"ö",u:"ü",A:"Ä",O:"Ö",U:"Ü"})[c])
    .replace(/\\'\{?e\}?/g, "é").replace(/\\c\{s\}/g, "ş").replace(/\\\.I/g, "İ")
    .replace(/\\textquotesingle(?![a-zA-Z])\s?/g, "'").replace(/\\textquotedbl(?![a-zA-Z])\s?/g, '"').replace(/\\textendash(?![a-zA-Z])\s?/g, "–").replace(/\\textemdash(?![a-zA-Z])\s?/g, "—")
    .replace(/\\([&%#_{}])/g, "$1").replace(/\\ /g, " ");
}
function boxedToMath(s, put) {
  let out = "", i = 0;
  for (;;) {
    const j = s.indexOf("\\boxed{", i); if (j < 0) return out + s.slice(i);
    let k = j + 7, depth = 0;
    for (; k < s.length; k++) { const c = s[k]; if (c === "\\") { k++; continue; } if (c === "{") depth++; else if (c === "}") { depth--; if (depth === 0) break; } }
    if (k >= s.length) return out + s.slice(i);
    out += s.slice(i, j) + put(esc("$" + s.slice(j, k + 1) + "$")); i = k + 1;
  }
}
const typesetQueue = [];
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetClear && MathJax.typesetClear([el]);
    return MathJax.typesetPromise([el]).catch(e => console.warn(e));
  }
  typesetQueue.push(el);
}
(function waitMJ() {
  if (window.MathJax && MathJax.typesetPromise && MathJax.startup && MathJax.startup.promise) {
    MathJax.startup.promise.then(() => { while (typesetQueue.length) typeset(typesetQueue.shift()); });
  } else setTimeout(waitMJ, 200);
})();

/* ---------- question panel ---------- */
let openId = null;
async function openQuestion(id) {
  const q = D.byId.get(id); if (!q) { toast(`No question with ID ${id}`); return; }
  openId = id;
  $("#scrim").classList.add("open"); $("#panel").classList.add("open");
  $("#pid").textContent = id;
  const t = trashOf(q);
  $("#p-trash").textContent = t ? "Restore" : "Delete";
  $("#p-trash").classList.toggle("danger", !t);
  $("#p-flag").textContent = flagOf(q) ? "Edit flag" : "Flag for Claude";
  $("#pcontent").innerHTML = `<div class="loading">Loading…</div>`;
  const tx = await ensureText(q); const assets = await assetsOf(q);
  if (openId !== id) return;
  if (!tx) { $("#pcontent").innerHTML = `<div class="empty">Couldn't load this question's text.</div>`; return; }
  const m = tx.m || {}, src = m.source || {}, fl = flagOf(q), f = placeOf(q);
  const srcLine = [src.competition, src.year, src.division, src.paper, src.round, src.question_number != null ? "Problem " + src.question_number : null].filter(x => x != null && x !== "").join(" · ");
  const url = (tx.q.match(/^%\s*Source:\s*(\S+)/m) || [])[1];
  $("#pcontent").innerHTML = `
    <div class="head" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)">${headHtml(q)}</div>
    ${fl ? `<div class="note"><b>Flagged for Claude</b>${fl.at ? ` · ${esc(String(fl.at).slice(0, 10))}` : ""}<br>${esc(fl.note || "(no note)")}</div>` : ""}
    <section><h3>Question</h3><div class="tex">${texToHtml(tx.q, assets, m, "question.tex")}</div></section>
    <section><h3>Solution <button class="btn" type="button" id="togglesol">Hide</button></h3><div class="tex" id="soltex">${texToHtml(tx.s, assets, m, "solution.tex")}</div></section>
    <section class="meta">
      <span>Tags</span><span>${(m.tags || []).map(esc).join(", ") || "—"}</span>
      <span>Difficulty</span><span>${esc(m.difficulty ?? "—")}${m.difficulty_rationale ? " · " + esc(m.difficulty_rationale) : ""}</span>
      <span>Source</span><span>${esc(srcLine || (url ? "AoPS forum" : "—"))}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener">original post</a>` : ""}</span>
      <span>Folder</span><span>${f && S.folders[f] ? esc(S.folders[f].name) : "Unfiled"}</span>
      ${m.note ? `<span>Editor's note</span><span>${esc(m.note)}</span>` : ""}
    </section>
    <details><summary>LaTeX source</summary><p class="hint">question.tex</p><div class="src">${esc(tx.q)}</div><p class="hint">solution.tex</p><div class="src">${esc(tx.s)}</div></details>`;
  typeset($("#pcontent"));
  $("#p-close").focus();
}
function closePanel() { openId = null; $("#scrim").classList.remove("open"); $("#panel").classList.remove("open"); }

/* ---------- dialogs & toasts ---------- */
function toast(msg, ms = 3500) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
function dialog(html, onOk) {
  const d = $("#dlg"), f = $("#dlgform");
  f.innerHTML = html + `<div class="actions"><button class="btn" type="button" value="cancel" id="dlg-cancel">Cancel</button><button class="btn primary" type="submit" value="ok" id="dlg-ok">OK</button></div>`;
  $("#dlg-cancel").onclick = () => d.close();
  f.onsubmit = async e => { e.preventDefault(); const ok = await onOk(f); if (ok !== false) d.close(); };
  d.showModal(); const first = f.querySelector("input,select,textarea"); if (first) first.focus();
}
function folderOptions(selected) {
  const kids = {}; for (const [id, f] of Object.entries(S.folders)) (kids[f.parent || ""] = kids[f.parent || ""] || []).push(id);
  const out = []; const walk = (p, depth) => (kids[p] || []).sort((a, b) => S.folders[a].name.localeCompare(S.folders[b].name, undefined, { numeric: true }))
    .forEach(id => { out.push(`<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${"  ".repeat(depth)}${depth ? "└ " : ""}${esc(S.folders[id].name)}</option>`); walk(id, depth + 1); });
  walk("", 0); return out.join("");
}
function newFolderId() { return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

async function moveIds(ids) {
  dialog(`<h3>Move ${ids.length.toLocaleString()} question${ids.length > 1 ? "s" : ""}</h3>
    <label for="mv-f">Folder</label><select id="mv-f"><option value="">Unfiled</option>${folderOptions("")}<option value="__new">New folder…</option></select>
    <div id="mv-newwrap" hidden><label for="mv-new">New folder name</label><input type="text" id="mv-new"></div>`, async f => {
    let fid = $("#mv-f", f).value;
    if (fid === "__new") { const name = $("#mv-new", f).value.trim(); if (!name) { toast("Type a folder name."); return false; } fid = newFolderId(); await guard(store.setFolder(fid, { name, parent: null, created: new Date().toISOString() })); }
    const ch = {}; ids.forEach(id => ch[id] = fid || null);
    await guard(store.writeShards("place", ch), `Moved ${ids.length.toLocaleString()} question${ids.length > 1 ? "s" : ""}.`);
    refresh(true); if (openId) openQuestion(openId);
  });
  $("#mv-f").onchange = e => $("#mv-newwrap").hidden = e.target.value !== "__new";
}
async function trashIds(ids, restore) {
  const ch = {}; const at = new Date().toISOString(); ids.forEach(id => ch[id] = restore ? null : { at });
  await guard(store.writeShards("trash", ch), restore ? `Restored ${ids.length.toLocaleString()}.` : `Moved ${ids.length.toLocaleString()} to Trash. Restore them from Trash if needed.`);
  ids.forEach(id => sel.delete(id)); refresh(true);
}
function purgeIds(ids) {
  dialog(`<h3>Delete ${ids.length.toLocaleString()} forever?</h3><p>They disappear from the bank. Claude removes them from the GitHub copy at the next backup, and they can still be recovered from GitHub history.</p>`, async () => {
    const ch = {}; const at = new Date().toISOString(); ids.forEach(id => ch[id] = { at, purged: true });
    await guard(store.writeShards("trash", ch), `Deleted ${ids.length.toLocaleString()} forever.`); ids.forEach(id => sel.delete(id)); refresh(true);
  });
}
function flagIds(ids) {
  const cur = ids.length === 1 ? flagOf(D.byId.get(ids[0])) : null;
  dialog(`<h3>Flag for Claude</h3><p class="hint">Say what's wrong. Ask Claude to "fix the flagged questions" and it works through the list.</p>
    <label for="fl-note">Note</label><textarea id="fl-note" placeholder="e.g. answer should be 12, diagram labels overlap">${esc(cur ? cur.note : "")}</textarea>
    ${cur ? `<label><input type="checkbox" id="fl-clear"> Remove the flag</label>` : ""}`, async f => {
    const clear = $("#fl-clear", f) && $("#fl-clear", f).checked; const note = $("#fl-note", f).value.trim();
    for (const id of ids) await guard(clear ? store.clearFlag(id) : store.setFlag(id, { note, at: new Date().toISOString() }));
    toast(clear ? "Flag removed." : `Flagged ${ids.length.toLocaleString()}.`); refresh(true); if (openId) openQuestion(openId);
  });
}
async function guard(p, okMsg) {
  try { await p; if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const c = e && e.code;
    toast(c === "quota_exceeded" ? "The page's database is full. Ask Claude to back up and fold changes into the main data." :
          c === "resource_exhausted" ? "Too many changes at once. Wait a moment and try again." :
          c === "invalid_argument" ? "This change was refused. You may only have view access." : `Couldn't save: ${(e && (e.message || e.code)) || e}`, 6000);
    return false;
  }
}

/* ---------- export ---------- */
async function saveFile(name, blob) {
  const dl = window.claude ? await claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast(`Saved ${name}.`); } catch (e) { if (e.code !== "declined") toast(`Couldn't save: ${e.message || e.code}`); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
async function gather(ids, withAssets, progress) {
  const qs = ids.map(id => D.byId.get(id)).filter(Boolean);
  const hs = [...new Set(qs.filter(q => !q.imported).map(q => q.h))];
  let done = 0; for (const h of hs) { await loadText(h); progress && progress(`Loading text ${++done}/${hs.length}`); }
  const out = [];
  for (const q of qs) { const t = textOf(q); out.push({ q, t, a: withAssets ? await assetsOf(q) : {} }); if (withAssets && out.length % 200 === 0) progress && progress(`Loading diagrams ${out.length}/${qs.length}`); }
  return out;
}
async function exportZip(ids) {
  if (typeof JSZip === "undefined") { toast("The ZIP library didn't load. Reload the page and try again."); return; }
  toast(`Preparing ${ids.length.toLocaleString()} questions…`, 2500);
  const items = await gather(ids, true, m => $("#selwhat").textContent = m);
  const z = new JSZip();
  z.file("manifest.json", JSON.stringify({ schema_version: "1.0", question_ids: items.map(x => x.q.id) }, null, 2) + "\n");
  for (const { q, t, a } of items) {
    if (!t) continue; const dir = `questions/${q.id}/`;
    z.file(dir + "metadata.json", JSON.stringify(t.m, null, 2) + "\n");
    z.file(dir + (t.m.question_file || "question.tex"), t.q);
    z.file(dir + (t.m.solution_file || "solution.tex"), t.s);
    for (const [p, svg] of Object.entries(a)) z.file(dir + p, svg);
  }
  const blob = await z.generateAsync({ type: "blob", compression: "DEFLATE" }, m => $("#selwhat").textContent = `Zipping ${Math.round(m.percent)}%`);
  renderSel();
  await saveFile(`question_bank_export_${items.length}.zip`, blob);
}
function exportTex(ids) {
  dialog(`<h3>Export ${ids.length.toLocaleString()} as .tex</h3>
    <label for="tx-title">Title</label><input type="text" id="tx-title" value="Problem set">
    <label for="tx-sol">Solutions</label><select id="tx-sol"><option value="end">Solutions at the end</option><option value="after">Solution after each question</option><option value="none">Questions only</option></select>
    <label><input type="checkbox" id="tx-ids" checked> Show question IDs</label>
    <p class="hint">Compile with pdflatex, then run asy on the generated .asy files and pdflatex again for diagrams.</p>`, async f => {
    const title = $("#tx-title", f).value, mode = $("#tx-sol", f).value, showIds = $("#tx-ids", f).checked;
    const items = await gather(ids, false);
    const pk = new Set(["amsmath", "amssymb", "asymptote", "enumitem"]);
    items.forEach(x => ((x.t && x.t.m.latex_dependencies || {}).packages || []).forEach(p => pk.add(p.name)));
    const strip = s => String(s || "").split("\n").filter(l => !/^\s*%/.test(l)).join("\n").trim();
    const lab = x => showIds ? `\\hfill{\\scriptsize\\texttt{${x.q.id}}}` : "";
    let body = "";
    if (mode === "after") body = items.map((x, i) => `\\subsection*{Problem ${i + 1}${lab(x)}}\n${strip(x.t && x.t.q)}\n\n\\paragraph{Solution.} ${strip(x.t && x.t.s)}\n`).join("\n");
    else {
      body = "\\begin{enumerate}[label=\\textbf{\\arabic*.}]\n" + items.map(x => `\\item ${lab(x)}\n${strip(x.t && x.t.q)}\n`).join("\n") + "\\end{enumerate}\n";
      if (mode === "end") body += "\n\\newpage\n\\section*{Solutions}\n\\begin{enumerate}[label=\\textbf{\\arabic*.}]\n" + items.map(x => `\\item ${strip(x.t && x.t.s)}\n`).join("\n") + "\\end{enumerate}\n";
    }
    const tex = `\\documentclass[11pt]{article}\n\\usepackage[margin=2cm]{geometry}\n${[...pk].map(p => `\\usepackage{${p}}`).join("\n")}\n\\setlength{\\parindent}{0pt}\n\\begin{document}\n\\section*{${title.replace(/[\\{}$&#%_^~]/g, "")}}\n${body}\\end{document}\n`;
    await saveFile(`${(title || "problems").replace(/[^\w-]+/g, "_")}.tex`, new Blob([tex], { type: "text/plain" }));
  });
}

/* ---------- import ---------- */
async function importZip(file) {
  if (typeof JSZip === "undefined") { toast("The ZIP library didn't load. Reload the page and try again."); return; }
  let z; try { z = await JSZip.loadAsync(file); } catch (e) { toast("That file isn't a readable ZIP."); return; }
  const mf = z.file("manifest.json"); if (!mf) { toast("No manifest.json in this ZIP, so it isn't in the import format."); return; }
  let man; try { man = JSON.parse(await mf.async("string")); } catch (e) { toast("manifest.json couldn't be read."); return; }
  const ids = man.question_ids || []; let added = 0, skipped = 0, failed = [];
  for (const [i, id] of ids.entries()) {
    $("#count").textContent = `Importing ${i + 1}/${ids.length}…`;
    if (D.byId.has(id)) { skipped++; continue; }
    const dir = `questions/${id}/`;
    try {
      const m = JSON.parse(await z.file(dir + "metadata.json").async("string"));
      const rd = async n => { const f = z.file(dir + n); return f ? f.async("string") : ""; };
      const assets = {}; for (const a of m.assets || []) if (/\.svg$/i.test(a.path) && z.file(dir + a.path)) assets[a.path] = await rd(a.path);
      const doc = { m, q: await rd(m.question_file || "question.tex"), s: await rd(m.solution_file || "solution.tex"), assets, at: new Date().toISOString(), from: file.name };
      if (JSON.stringify(doc).length > 250000) { failed.push(id + " (too large)"); continue; }
      if (await guard(store.putImported(id, doc))) added++; else failed.push(id);
    } catch (e) { failed.push(id); }
  }
  dialog(`<h3>Import finished</h3><p>${added.toLocaleString()} added, ${skipped.toLocaleString()} skipped because their IDs already exist${failed.length ? `, ${failed.length} failed: ${esc(failed.slice(0, 10).join(", "))}${failed.length > 10 ? "…" : ""}` : ""}.</p><p class="hint">New questions show under "Imported, waiting for backup" until Claude folds them into the main data.</p>`, () => {});
  $("#dlg-cancel").hidden = true;
  refresh(true);
}

/* ---------- events ---------- */
let qTimer = null;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const v = e.target.value.trim();
    if (D.byId.has(v)) { openQuestion(v); }
    state.query = v; refresh();
  }, 200);
});
$("#tagfilter").addEventListener("input", e => { state.tagFind = e.target.value; renderFacets(compute()); });
$("#tags").addEventListener("click", e => {
  const b = e.target.closest("[data-tag]"); if (!b) return; const i = +b.dataset.tag;
  if (state.inc.has(i)) { state.inc.delete(i); state.exc.add(i); } else if (state.exc.has(i)) state.exc.delete(i); else state.inc.add(i);
  refresh();
});
$("#mode-all").onclick = () => { state.mode = "all"; refresh(); };
$("#mode-any").onclick = () => { state.mode = "any"; refresh(); };
$("#cleartags").onclick = () => { state.inc.clear(); state.exc.clear(); refresh(); };
$("#diffs").addEventListener("click", e => { const b = e.target.closest("[data-diff]"); if (!b) return; const d = +b.dataset.diff; state.diffs.has(d) ? state.diffs.delete(d) : state.diffs.add(d); refresh(); });
$("#cleardiff").onclick = () => { state.diffs.clear(); refresh(); };
$("#comps").addEventListener("click", e => { const b = e.target.closest("[data-comp]"); if (!b) return; const c = +b.dataset.comp; state.comps.has(c) ? state.comps.delete(c) : state.comps.add(c); refresh(); });
$("#clearsrc").onclick = () => { state.comps.clear(); state.ymin = state.ymax = null; $("#ymin").value = $("#ymax").value = ""; refresh(); };
$("#ymin").onchange = e => { state.ymin = e.target.value === "" ? null : +e.target.value; refresh(); };
$("#ymax").onchange = e => { state.ymax = e.target.value === "" ? null : +e.target.value; refresh(); };
$("#more").addEventListener("click", e => { if (e.target.closest("#diagchip")) { state.diag = !state.diag; refresh(); } });
$("#sort").onchange = e => { state.sort = e.target.value; refresh(); };
$("#folders").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (!b) return; state.view = b.dataset.view; sel.clear(); refresh(); });
$("#folders").addEventListener("dblclick", e => {
  const b = e.target.closest("[data-view]"); if (!b || !S.folders[b.dataset.view]) return; folderDialog(b.dataset.view);
});
$("#newfolder").onclick = () => folderDialog(null);
function folderDialog(fid) {
  const f = fid ? S.folders[fid] : null;
  dialog(`<h3>${f ? "Edit folder" : "New folder"}</h3>
    <label for="fd-name">Name</label><input type="text" id="fd-name" value="${esc(f ? f.name : "")}">
    <label for="fd-parent">Inside</label><select id="fd-parent"><option value="">(top level)</option>${folderOptions(f ? f.parent : "")}</select>
    ${f ? `<label><input type="checkbox" id="fd-del"> Delete this folder (its questions become Unfiled)</label>` : `<p class="hint">Double-click a folder to rename, nest or delete it.</p>`}`, async form => {
    const name = $("#fd-name", form).value.trim(), parent = $("#fd-parent", form).value || null;
    if (f && $("#fd-del", form).checked) {
      const ch = {}; D.qs.forEach(q => { if (placeOf(q) === fid) ch[q.id] = null; });
      await guard(store.writeShards("place", ch));
      for (const [id, g] of Object.entries(S.folders)) if (g.parent === fid) await guard(store.setFolder(id, { ...g, parent: f.parent || null }));
      await guard(store.deleteFolder(fid), "Folder deleted."); if (state.view === fid) state.view = "all"; refresh(); return;
    }
    if (!name) { toast("Type a folder name."); return false; }
    if (fid && (parent === fid || descendantOf(parent, fid))) { toast("A folder can't go inside itself."); return false; }
    await guard(store.setFolder(fid || newFolderId(), { ...(f || { created: new Date().toISOString() }), name, parent }), f ? "Folder updated." : "Folder created.");
    refresh(true);
  });
}
$("#list").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return; const id = card.dataset.id;
  if (e.target.matches("input[type=checkbox]")) { e.target.checked ? sel.add(id) : sel.delete(id); card.classList.toggle("sel", e.target.checked); renderSel(); return; }
  if (e.target.closest(".id") || e.target.closest("[data-open]")) { if (!e.target.closest("a,summary")) openQuestion(id); }
});
$("#pager").addEventListener("click", e => { const b = e.target.closest("[data-page]"); if (!b) return; state.page = +b.dataset.page; renderList(); $("#main").scrollTop = 0; });
$("#selall").onclick = () => { results.forEach(q => sel.add(q.id)); renderSel(); renderList(); };
$("#selbar").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return; const ids = [...sel];
  ({ move: () => moveIds(ids), zip: () => exportZip(ids), tex: () => exportTex(ids), flag: () => flagIds(ids), trash: () => trashIds(ids),
     restore: () => trashIds(ids, true), purge: () => purgeIds(ids), clear: () => { sel.clear(); renderSel(); renderList(); } })[a.dataset.act]();
});
$("#importbtn").onclick = () => $("#importfile").click();
$("#importfile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importZip(f); };
$("#scrim").onclick = closePanel; $("#p-close").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape" && openId && !$("#dlg").open) closePanel(); });
$("#p-move").onclick = () => moveIds([openId]);
$("#p-flag").onclick = () => flagIds([openId]);
$("#p-trash").onclick = async () => { const q = D.byId.get(openId); const r = !!trashOf(q); await trashIds([openId], r); openQuestion(openId); };
$("#p-copy").onclick = async () => { const q = D.byId.get(openId); const t = textOf(q); if (!t) return;
  try { await navigator.clipboard.writeText(`% ${q.id}\n${t.q}\n\n% Solution\n${t.s}`); toast("LaTeX copied."); } catch (e) { toast("Copying was blocked. Open “LaTeX source” and copy from there."); } };
$("#pcontent").addEventListener("click", e => { if (e.target.id === "togglesol") { const s = $("#soltex"); s.hidden = !s.hidden; e.target.textContent = s.hidden ? "Show" : "Hide"; } });

/* ---------- start ---------- */
(async function main() {
  try { await loadIndex(); }
  catch (e) { $("#count").textContent = "Couldn't load the question data."; $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  let db = null;
  if (window.claude && claude.use) { db = await Promise.race([claude.use("db").catch(() => null), new Promise(r => setTimeout(() => r(null), 10000))]); }
  store = db ? new ClaudeStore(db) : new LocalStore();
  let first = true;
  const loadTimer = setTimeout(() => { if (first) toast("Your folders and flags can't be reached yet; showing questions without them."); }, 10000);
  await store.start(() => { if (first) { first = false; clearTimeout(loadTimer); } refresh(true); });
  ready = true; refresh();
  updateSearchHint();
  loadAllTextInBackground();
})();
